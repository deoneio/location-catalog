services:
  nginx:
    image: nginx:alpine
    container_name: shareloc-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - nuxt
      - directus
    networks:
      - shareloc-network

  nuxt:
    image: ghcr.io/deoneio/location-catalog:test
    container_name: shareloc-nuxt
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - USE_MOCK=false
      - DIRECTUS_URL=http://directus:8055
    networks:
      - shareloc-network
    depends_on:
      - directus

  directus:
    image: directus/directus:12
    container_name: shareloc-directus
    restart: unless-stopped
    user: "1002:1002"
    environment:
      KEY: "${DIRECTUS_KEY:-shareloc-secret-key}"
      SECRET: "${DIRECTUS_SECRET:-shareloc-secret-value}"
      DB_CLIENT: "sqlite3"
      DB_FILENAME: "/directus/database/data.db"
      PM2_HOME: "/tmp/pm2"
      PUBLIC_URL: "${CMS_PUBLIC_URL}"
    volumes:
      - ./data/directus/database:/directus/database
      - ./data/directus/uploads:/directus/uploads
      - ./data/extensions_cache:/directus/node_modules/.directus
      - ./scripts:/directus/scripts
    networks:
      - shareloc-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: shareloc-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - shareloc-network
    depends_on:
      - nginx
    dns:
      - 1.1.1.1
      - 1.0.0.1

networks:
  shareloc-network:
    driver: bridge